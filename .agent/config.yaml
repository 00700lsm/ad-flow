runtime:
  mode: "ide_assisted" # pipeline_native | ide_assisted
  sandbox: "docker" # docker | local_isolated

governance:
  model_policy: "auto_cascading" # auto_cascading | fixed_high | custom
  budget:
    max_tokens_per_task: 80000
    max_cost_usd: 1.00
    max_retry_limit: 3

models:
  analysis: "high_tier"
  tdd_design: "high_tier"
  coding: "high_tier"
  lint_fix: "light_tier"
  refactor: "high_tier"

project:
  current_phase: 4
  source_of_truth:
    - docs/REQUIREMENTS.md
    - docs/DESIGN.md
    - docs/ROADMAP.md
    - docs/TASKS.md
